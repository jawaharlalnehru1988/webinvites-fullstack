<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hari weds Rukmini</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700;900&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Bonheur+Royale&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --gold:#d9b06a;
    --gold-soft:#eccf94;
    --cream:#fbf1e2;
    --brown:#3c2110;
    --rose:#e05c7c;
    --rose-deep:#a83454;
    --purple-deep:#5b2a6e;
    --ink:#2a0f18;
  }
  *{box-sizing:border-box;}
  html{ margin:0; padding:0; width:100%; }
  body{
    margin:0; padding:0; width:100%;
    overflow-x:hidden; background:#fdfbf6;
    -webkit-tap-highlight-color: transparent;
  }
  body{ font-family:'Cormorant Garamond', serif; }

  .stage{
    position:relative; width:100vw; height:100vh;
    overflow:hidden; cursor:pointer;
    background:#1c0e12;
  }

  /* ---------- vignette ---------- */
  .vignette{
    position:absolute; inset:0; z-index:7; pointer-events:none;
    box-shadow: inset 0 0 18vw rgba(10,3,5,0.55);
  }

  /* ---------- end (revealed) layer, always full, always still ---------- */
  .layer-end{ position:absolute; inset:0; z-index:1; overflow:hidden; }
  .layer-end img{ position:absolute; display:block; }

  /* ---------- zoom wrapper: everything belonging to the "start" frame ---------- */
  .zoom-wrap{
    position:absolute; inset:0; z-index:2;
    will-change: transform;
  }
  .frag{ position:absolute; overflow:hidden; }
  .frag img{ position:absolute; display:block; }

  /* ---------- door hinge/perspective container ---------- */
  .door-perspective{
    position:absolute; z-index:3;
  }
  .door-panel{
    position:absolute; top:0; height:100%; overflow:hidden;
    backface-visibility:hidden;
  }
  .door-panel.left{ left:0; transform-origin:0% 50%; }
  .door-panel.right{ transform-origin:100% 50%; }
  .frag-inner-holder{ position:absolute; inset:0; overflow:hidden; }
  .frag-inner-holder img{ position:absolute; display:block; }
  .door-panel .shade{
    position:absolute; inset:0; z-index:2; opacity:0;
    pointer-events:none;
  }
  .door-panel.left .shade{ background:linear-gradient(to right, rgba(20,4,10,0) 45%, rgba(20,4,10,0.6) 100%); }
  .door-panel.right .shade{ background:linear-gradient(to left, rgba(20,4,10,0) 45%, rgba(20,4,10,0.6) 100%); }

  .light-crack{
    position:absolute; top:0; height:100%; z-index:1;
    background:linear-gradient(to right, rgba(255,236,190,0), rgba(255,244,220,0.95) 50%, rgba(255,236,190,0));
    filter:blur(6px);
    opacity:0;
    pointer-events:none;
  }

  /* ---------- titles ---------- */
  .cover-title, .final-title{
    position:absolute; left:50%; z-index:6;
    transform:translateX(-50%);
    text-align:center; width:min(92vw, 720px);
    pointer-events:none;
  }
  .cover-title{ top:9%; }
  .final-title{ top:4%; opacity:0; padding-top:2.2em; }
  .final-title::before{
    content:'';
    position:absolute; left:50%; top:-15%; transform:translateX(-50%);
    width:160%; height:170%;
    background:radial-gradient(ellipse 55% 65% at 50% 32%, rgba(255,248,232,0.65), rgba(255,248,232,0.32) 55%, rgba(255,248,232,0) 78%);
    z-index:-1;
    pointer-events:none;
  }
  .final-title .title-names{ font-size: clamp(2rem, 5.2vw, 3.6rem); }
  .final-title .title-weds{ font-size: clamp(0.85rem, 1.8vw, 1.2rem); letter-spacing:0.45em; }

  .title-names{
    font-family:'Cinzel Decorative', serif;
    font-weight:700;
    color: var(--brown);
    font-size: clamp(2.1rem, 6vw, 4.2rem);
    letter-spacing: 0.03em;
    text-shadow: 0 2px 18px rgba(255,248,232,0.6), 0 1px 3px rgba(255,248,232,0.55);
    line-height:1.15;
    margin:0;
  }
  .title-weds{
    display:block;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:500;
    font-size: clamp(0.95rem, 2.4vw, 1.5rem);
    letter-spacing:0.5em;
    text-transform:uppercase;
    color: var(--brown);
    margin: 0.35em 0;
    text-shadow: 0 2px 10px rgba(255,248,232,0.55);
  }
  .cover-hint{
    margin-top:1.1em;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:500;
    font-size: clamp(0.8rem, 1.6vw, 1.05rem);
    letter-spacing:0.32em;
    text-transform:uppercase;
    color: var(--gold-soft);
    opacity:0.88;
  }
  @media (prefers-reduced-motion: no-preference){
    .cover-hint{ animation: hintPulse 2.6s ease-in-out infinite; }
  }
  @keyframes hintPulse{
    0%,100%{ opacity:0.5; }
    50%{ opacity:1; }
  }

  .final-title .title-names, .final-title .title-weds{
    color: var(--brown);
  }

  /* ---------- petals ---------- */
  .petals{ position:absolute; inset:0; z-index:8; overflow:hidden; pointer-events:none; }
  .petal{
    position:absolute; top:-8%;
    width:var(--s); height:var(--s);
    opacity:0;
    left:var(--x);
  }
  .petals.active .petal{
    animation: petalFall var(--dur) linear var(--delay) infinite;
  }
  .petal svg{ width:100%; height:100%; display:block; filter:drop-shadow(0 2px 3px rgba(80,10,30,0.18)); }

  @keyframes petalFall{
    0%   { transform: translate(0,0) rotate(0deg);  opacity:0; }
    6%   { opacity: var(--op); }
    50%  { transform: translate(var(--sway), 55vh) rotate(var(--rot)); }
    92%  { opacity: var(--op); }
    100% { transform: translate(calc(var(--sway) * -1), 112vh) rotate(calc(var(--rot) * -1)); opacity:0; }
  }

  /* ================= ANIMATION TIMELINE ================= */
  .stage.playing .cover-title{
    animation: coverOut 0.55s ease forwards;
  }
  @keyframes coverOut{
    to{ opacity:0; transform:translateX(-50%) translateY(-14px); }
  }

  .stage.playing .zoom-wrap{
    animation: zoomIn 2.9s cubic-bezier(.6,.03,.25,1) forwards,
               frameFadeOut 0.7s ease-out forwards;
    animation-delay: 0s, 2.9s;
  }
  @keyframes zoomIn{
    from{ transform:scale(1); }
    to{ transform:scale(var(--zoom-scale)); }
  }
  @keyframes frameFadeOut{
    to{ opacity:0; visibility:hidden; }
  }

  .stage.playing .light-crack{
    animation: crackPulse 1.6s ease-out forwards;
    animation-delay: 0.15s;
  }
  @keyframes crackPulse{
    0%{ opacity:0; }
    45%{ opacity:0.85; }
    100%{ opacity:0; }
  }

  .stage.playing .door-panel.left{
    animation: rotLeft 2.9s cubic-bezier(.45,0,.2,1) forwards;
    animation-delay: 0s;
  }
  .stage.playing .door-panel.right{
    animation: rotRight 2.9s cubic-bezier(.45,0,.2,1) forwards;
    animation-delay: 0s;
  }
  @keyframes rotLeft{ to{ transform: rotateY(calc(var(--door-angle) * -1)); } }
  @keyframes rotRight{ to{ transform: rotateY(var(--door-angle)); } }

  .stage.playing .door-panel .shade{
    animation: shadeIn 2.9s ease forwards;
    animation-delay: 0s;
  }
  @keyframes shadeIn{ to{ opacity:1; } }

  .stage.playing .final-title{
    animation: titleIn 1.1s ease forwards;
    animation-delay: 3.65s;
  }
  @keyframes titleIn{
    from{ opacity:0; transform:translateX(-50%) translateY(10px); }
    to{ opacity:1; transform:translateX(-50%) translateY(0); }
  }

  /* ---------- reduced motion: simple crossfade instead of the door choreography ---------- */
  .stage.reduced .zoom-wrap{ transition: opacity 0.7s ease; }
  .stage.reduced.playing .zoom-wrap{ animation:none; opacity:0; }
  .stage.reduced .door-panel, .stage.reduced .light-crack{ display:none; }
  .stage.reduced.playing .final-title{ animation: titleIn 0.9s ease forwards; animation-delay: 0.6s; }

  .sr-only{
    position:absolute; width:1px; height:1px; padding:0; margin:-1px;
    overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0;
  }

  /* ================= LETTER / SCROLL SECTION ================= */
  .letter-section{
    position:relative;
    height:320vh;
    background:#fdfbf6;
  }
  .letter-pin{
    position:sticky; top:0;
    height:100vh; width:100%;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    background:
      radial-gradient(ellipse 70% 60% at 50% 45%, rgba(217,176,106,0.10), rgba(217,176,106,0) 70%),
      #fdfbf6;
  }

  .scroll-stage{
    position:relative;
    width:min(78vw, 58vh, 480px);
    aspect-ratio: 1391 / 1542;
    z-index:2;
  }
  .scroll-stage img{
    position:absolute; left:0; top:0;
    width:100%; height:100%;
    display:block;
    object-fit:contain;
  }
  .scroll-open{
    clip-path: inset(0 0 100% 0);
    will-change: clip-path;
  }
  .letter-text{
    position:absolute;
    left:50%; top:50%;
    transform:translate(-50%, -50%);
    width:60%;
    text-align:center;
    opacity:0;
    pointer-events:none;
  }
  .save-the-date{
    font-family:'Bonheur Royale', cursive;
    color: var(--brown);
    font-size: clamp(1.7rem, 5.4vw, 3.1rem);
    line-height:1.15;
  }
  .letter-date{
    font-family:'Poppins', sans-serif;
    font-weight:700;
    color: var(--brown);
    font-size: clamp(0.85rem, 1.9vw, 1.15rem);
    letter-spacing:0.12em;
    margin-top:0.6em;
  }

  @media (max-width: 640px){
    .scroll-stage{ width:min(80vw, 50vh, 380px); }
    .letter-text{ width:70%; }
  }

  /* ---------- blend the hero into the letter section ---------- */
  .hero-fade-bottom{
    position:absolute; left:0; right:0; bottom:0; height:22vh;
    background: linear-gradient(to bottom, rgba(253,251,246,0) 0%, rgba(253,251,246,0.55) 55%, rgba(253,251,246,0.94) 100%);
    z-index:9;
    pointer-events:none;
  }

  /* ================= CARD STACK SECTION ================= */
  .cards-section{
    position:relative;
    height:260vh;
    background:#fdfbf6;
  }
  .cards-pin{
    position:sticky; top:0;
    height:100vh; width:100%;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  .card-stack{
    position:relative;
    width:min(60vw, 44vh, 330px);
    aspect-ratio: 1417 / 1910;
    container-type: inline-size;
  }
  .card{
    position:absolute; inset:0;
    will-change: transform, opacity;
    transform-origin: 50% 55%;
  }
  #card0{ z-index:3; }
  #card1{ z-index:2; }
  #card2{ z-index:1; }
  .card img{
    position:absolute; inset:0;
    width:100%; height:100%;
    display:block;
    object-fit:contain;
    filter: drop-shadow(0 14px 26px rgba(60,33,16,0.24));
  }
  .card-content{
    position:absolute;
    left:14.9%; top:7.8%;
    width:71.6%; height:73.9%;
    display:flex; align-items:center; justify-content:center;
    text-align:center;
    overflow:hidden;
    padding:6%;
    pointer-events:none;
  }
  .card-title{
    font-family:'Cinzel Decorative', serif;
    font-weight:700;
    letter-spacing:0.03em;
    font-size: clamp(1.05rem, 11cqw, 2rem);
    line-height:1.15;
    max-width:100%;
    overflow-wrap:break-word;
  }
  .card.pink .card-title{ color: var(--rose-deep); }
  .card.gold .card-title{ color: var(--brown); }
  .card.purple .card-title{ color: var(--purple-deep); }

  @media (max-width: 640px){
    .card-stack{ width:min(66vw, 40vh, 300px); }
  }
</style>
</head>
<body>

<script>
(function(){
  var IMG_W = 2200, IMG_H = 1368;
  var DOOR = { x0:0.443, x1:0.553, y0:0.596, y1:0.788 };
  var ZOOM_SCALE = 6.4;
  var DOOR_ANGLE = 63;

  var stage = document.getElementById('stage');
  var zoomWrap = document.getElementById('zoomWrap');
  var doorPerspective = document.getElementById('doorPerspective');
  var panelLeft = document.getElementById('panelLeft');
  var panelRight = document.getElementById('panelRight');
  var lightCrack = document.getElementById('lightCrack');
  var frameTop = document.getElementById('frameTop');
  var frameBottom = document.getElementById('frameBottom');
  var frameLeft = document.getElementById('frameLeft');
  var frameRight = document.getElementById('frameRight');
  var imgEnd = document.getElementById('imgEnd');
  var petalsEl = document.getElementById('petals');

  document.documentElement.style.setProperty('--zoom-scale', ZOOM_SCALE);
  document.documentElement.style.setProperty('--door-angle', DOOR_ANGLE + 'deg');

  function computeLayout(){
    var vw = window.innerWidth, vh = window.innerHeight;
    var scale = Math.max(vw / IMG_W, vh / IMG_H);
    var rw = IMG_W * scale, rh = IMG_H * scale;
    var ox = (vw - rw) / 2, oy = (vh - rh) / 2;
    var doorLeft = ox + DOOR.x0 * IMG_W * scale;
    var doorRight = ox + DOOR.x1 * IMG_W * scale;
    var doorTop = oy + DOOR.y0 * IMG_H * scale;
    var doorBottom = oy + DOOR.y1 * IMG_H * scale;
    return { vw:vw, vh:vh, scale:scale, rw:rw, rh:rh, ox:ox, oy:oy,
             doorLeft:doorLeft, doorRight:doorRight, doorTop:doorTop, doorBottom:doorBottom };
  }

  function setFrag(el, fragLeft, fragTop, fragW, fragH, ox, oy, rw, rh){
    el.style.left = fragLeft + 'px';
    el.style.top = fragTop + 'px';
    el.style.width = Math.max(0,fragW) + 'px';
    el.style.height = Math.max(0,fragH) + 'px';
    var img = el.querySelector('img');
    img.style.left = (ox - fragLeft) + 'px';
    img.style.top = (oy - fragTop) + 'px';
    img.style.width = rw + 'px';
    img.style.height = rh + 'px';
  }

  function applyLayout(){
    var L = computeLayout();

    setFrag(frameTop, 0, 0, L.vw, L.doorTop, L.ox, L.oy, L.rw, L.rh);
    setFrag(frameBottom, 0, L.doorBottom, L.vw, L.vh - L.doorBottom, L.ox, L.oy, L.rw, L.rh);
    setFrag(frameLeft, 0, L.doorTop, L.doorLeft, L.doorBottom - L.doorTop, L.ox, L.oy, L.rw, L.rh);
    setFrag(frameRight, L.doorRight, L.doorTop, L.vw - L.doorRight, L.doorBottom - L.doorTop, L.ox, L.oy, L.rw, L.rh);

    var dpLeft = L.doorLeft, dpTop = L.doorTop;
    var dpW = L.doorRight - L.doorLeft, dpH = L.doorBottom - L.doorTop;
    doorPerspective.style.left = dpLeft + 'px';
    doorPerspective.style.top = dpTop + 'px';
    doorPerspective.style.width = dpW + 'px';
    doorPerspective.style.height = dpH + 'px';
    doorPerspective.style.perspective = Math.max(dpW, dpH) * 2.1 + 'px';
    doorPerspective.style.perspectiveOrigin = '50% 50%';

    var innerOx = L.ox - dpLeft, innerOy = L.oy - dpTop;
    panelLeft.style.width = (dpW/2) + 'px';
    setFragImgOnly(panelLeft.querySelector('.frag-inner-holder'), 0, 0, innerOx, innerOy, L.rw, L.rh);

    panelRight.style.left = (dpW/2) + 'px';
    panelRight.style.width = (dpW/2) + 'px';
    setFragImgOnly(panelRight.querySelector('.frag-inner-holder'), dpW/2, 0, innerOx, innerOy, L.rw, L.rh);

    lightCrack.style.left = (dpW/2 - Math.max(5, dpW*0.018)) + 'px';
    lightCrack.style.width = Math.max(10, dpW*0.036) + 'px';

    imgEnd.style.left = L.ox + 'px';
    imgEnd.style.top = L.oy + 'px';
    imgEnd.style.width = L.rw + 'px';
    imgEnd.style.height = L.rh + 'px';

    var cx = (L.doorLeft + L.doorRight) / 2, cy = (L.doorTop + L.doorBottom) / 2;
    zoomWrap.style.transformOrigin = cx + 'px ' + cy + 'px';
  }

  function setFragImgOnly(holderEl, fragLeft, fragTop, ox, oy, rw, rh){
    var img = holderEl.querySelector('img');
    img.style.position = 'absolute';
    img.style.left = (ox - fragLeft) + 'px';
    img.style.top = (oy - fragTop) + 'px';
    img.style.width = rw + 'px';
    img.style.height = rh + 'px';
  }

  var petalCount = 22;
  var petalColors = ['#e8879e','#e0637f','#f2a7b8','#c94a68'];
  for(var i=0;i<petalCount;i++){
    var p = document.createElement('div');
    p.className = 'petal';
    var size = (14 + Math.random()*20).toFixed(1);
    var dur = (7 + Math.random()*7).toFixed(2);
    var delayBase = 0;
    var delay = ( -Math.random()*parseFloat(dur) ).toFixed(2);
    var xpos = (Math.random()*100).toFixed(1);
    var sway = (30 + Math.random()*70) * (Math.random() < 0.5 ? -1 : 1);
    var rot = (180 + Math.random()*360) * (Math.random() < 0.5 ? -1 : 1);
    var op = (0.55 + Math.random()*0.4).toFixed(2);
    p.style.setProperty('--s', size+'px');
    p.style.setProperty('--dur', dur+'s');
    p.style.setProperty('--delay', delay+'s');
    p.style.setProperty('--x', xpos+'%');
    p.style.setProperty('--sway', sway.toFixed(0)+'px');
    p.style.setProperty('--rot', rot.toFixed(0)+'deg');
    p.style.setProperty('--op', op);
    var color = petalColors[i % petalColors.length];
    p.innerHTML = '<svg viewBox="0 0 32 32"><path d="M16 3 C25 10 26 21 16 29 C6 21 7 10 16 3 Z" fill="'+color+'"/></svg>';
    petalsEl.appendChild(p);
  }

  var started = false, autoTimer = null;
  function startSequence(){
    if(started) return;
    started = true;
    clearTimeout(autoTimer);
    stage.classList.add('playing');
    var reduced = stage.classList.contains('reduced');
    var petalDelay = reduced ? 700 : 3600;
    setTimeout(function(){ petalsEl.classList.add('active'); }, petalDelay);
  }

  var mq = window.matchMedia('(prefers-reduced-motion: reduce)');
  if(mq.matches){ stage.classList.add('reduced'); }

  applyLayout();
  window.addEventListener('load', function(){
    applyLayout();
    autoTimer = setTimeout(startSequence, 900);
  });
  stage.addEventListener('click', startSequence);
  stage.addEventListener('keydown', function(e){
    if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); startSequence(); }
  });

  var resizeTimer;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(applyLayout, 120);
  });
})();
</script>

<script>
(function(){
  var letterSection = document.getElementById('letterSection');
  var scrollOpen = document.getElementById('scrollOpen');
  var letterText = document.getElementById('letterText');

  var REVEAL_MIN = 0.185;      // fraction of the scroll that's just the top rod (fully "closed" look)
  var TEXT_START = 0.5, TEXT_END = 0.75;

  function updateLetter(){
    var scrollableDistance = letterSection.offsetHeight - window.innerHeight;
    var progress = 0;
    if(scrollableDistance > 0){
      var rect = letterSection.getBoundingClientRect();
      progress = -rect.top / scrollableDistance;
    }
    progress = Math.max(0, Math.min(1, progress));

    var reveal = REVEAL_MIN + progress * (1 - REVEAL_MIN);
    scrollOpen.style.clipPath = 'inset(0 0 ' + ((1 - reveal) * 100).toFixed(2) + '% 0)';

    var textT = (progress - TEXT_START) / (TEXT_END - TEXT_START);
    textT = Math.max(0, Math.min(1, textT));
    letterText.style.opacity = String(textT);
  }

  var ticking = false;
  function onScroll(){
    if(!ticking){
      requestAnimationFrame(function(){ updateLetter(); ticking = false; });
      ticking = true;
    }
  }

  window.addEventListener('scroll', onScroll, { passive:true });
  window.addEventListener('resize', onScroll);
  updateLetter();
})();
</script>

<script>
(function(){
  var cardsSection = document.getElementById('cardsSection');
  var cards = [document.getElementById('card0'), document.getElementById('card1'), document.getElementById('card2')];
  var N = cards.length;
  var windows = N - 1;

  function clamp(v, a, b){ return Math.max(a, Math.min(b, v)); }

  function stackTransform(depth){
    depth = Math.max(0, depth);
    var ty = depth * 16;
    var tx = depth * 12;
    var rot = depth * 5;
    var scale = 1 - depth * 0.045;
    return { transform: 'translate(' + tx + 'px,' + ty + 'px) rotate(' + rot + 'deg) scale(' + scale + ')', opacity: 1 };
  }

  function dismissTransform(t){
    var te = t * t; // ease-in: accelerate away
    var ty = te * -130;
    var tx = te * -14;
    var rot = te * -22;
    var op = t < 0.7 ? 1 : 1 - (t - 0.7) / 0.3;
    return { transform: 'translate(' + tx + '%,' + ty + '%) rotate(' + rot + 'deg)', opacity: op };
  }

  function updateCards(){
    var scrollableDistance = cardsSection.offsetHeight - window.innerHeight;
    var progress = 0;
    if(scrollableDistance > 0){
      var rect = cardsSection.getBoundingClientRect();
      progress = -rect.top / scrollableDistance;
    }
    progress = clamp(progress, 0, 1);

    var raw = progress * windows;
    var currentWindow = clamp(Math.floor(raw), 0, windows - 1);
    var localT = raw - currentWindow;
    if(progress >= 1){ currentWindow = windows - 1; localT = 1; }
    if(progress <= 0){ currentWindow = 0; localT = 0; }

    var depthEase = 1 - (1 - localT) * (1 - localT); // ease-out: settle into place

    for(var c = 0; c < N; c++){
      var el = cards[c];
      var state;
      if(c < currentWindow){
        state = dismissTransform(1);
      } else if(c === currentWindow){
        state = dismissTransform(localT);
      } else {
        var depth = (c - currentWindow) - depthEase;
        state = stackTransform(depth);
      }
      el.style.transform = state.transform;
      el.style.opacity = String(state.opacity);
    }
  }

  var ticking2 = false;
  function onCardsScroll(){
    if(!ticking2){
      requestAnimationFrame(function(){ updateCards(); ticking2 = false; });
      ticking2 = true;
    }
  }

  window.addEventListener('scroll', onCardsScroll, { passive:true });
  window.addEventListener('resize', onCardsScroll);
  updateCards();
})();
</script>
